[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wilma-cli"
version = "0.1.0"
description = "A cozy terminal app for Wilma"
requires-python = ">=3.11"
dependencies = ["textual>=0.80", "rich", "typer>=0.12", "httpx>=0.27", "keyring>=25", "beautifulsoup4", "lxml"]

[project.optional-dependencies]
dev = ["pytest", "respx", "pytest-asyncio"]

[project.scripts]
wilma = "wilma.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/wilma"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
